<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de prótesis de mano</title>
<style>
:root{--bg:#0b0d10;--panel:#14171c;--line:#262b33;--tx:#e8ecf1;--mut:#8b94a1;--ac:#3ddc97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;overflow:hidden}
#app{display:flex;height:100%}
#view{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#side{width:290px;max-width:46vw;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
h1{font-size:15px;margin:0 0 2px}
.sub{color:var(--mut);font-size:11px;margin-bottom:12px}
h2{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px;font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:9px}
.row output{color:var(--ac);font-variant-numeric:tabular-nums}
.row input{grid-column:1/3;width:100%;accent-color:var(--ac)}
label.t{display:flex;align-items:center;gap:8px;margin-bottom:7px;cursor:pointer}
label.t input{accent-color:var(--ac)}
button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;font:inherit;margin:0 6px 6px 0}
button:hover,button.on{border-color:var(--ac);color:var(--ac)}
#hud{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top,0px));background:rgba(20,23,28,.8);border:1px solid var(--line);border-radius:8px;padding:10px 12px;backdrop-filter:blur(6px)}
#hud div{display:flex;justify-content:space-between;gap:18px}
#hud b{color:var(--ac);font-weight:500}
#tip{position:absolute;left:12px;bottom:12px;color:var(--mut);font-size:11px}
@media(max-width:640px){#app{flex-direction:column}#side{width:auto;max-width:none;height:42%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
 <div id="view">
  <canvas id="c"></canvas>
  <div id="hud">
   <div>Pieza <b id="hPart">—</b></div>
   <div>Peso <b id="hW">—</b></div>
   <div>Fuerza de agarre <b id="hF">—</b></div>
   <div>Flexión media <b id="hC">—</b></div>
  </div>
  <div id="tip">Arrastra para orbitar · rueda para zoom</div>
 </div>
 <aside id="side">
  <h1>Prótesis de mano ZM-01</h1>
  <div class="sub">Configurador interactivo en tiempo real</div>
  <h2>Acciones</h2>
  <button id="bGrip">Cerrar / abrir mano</button>
  <button id="bPrint">Revelar impresión</button>
  <button id="bReset">Restablecer</button>
  <h2>Ingeniería</h2><div id="eng"></div>
  <h2>Transformación</h2><div id="tr"></div>
  <h2>Capas y animación</h2><div id="tg"></div>
 </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const DEF={wall:2.5,flex:0.8,force:40,dist:50,px:0,py:0,rx:0,rz:0,scale:1};
const SL=[
 ['wall','Grosor de pared',1,5,0.1,'mm','eng'],['flex','Flexibilidad',0.2,1.2,0.01,'','eng'],
 ['force','Fuerza de agarre',5,100,1,' N','eng'],['dist','Distribución de peso (distal)',0,100,1,' %','eng'],
 ['px','Posición X',-1.5,1.5,0.01,'','tr'],['py','Posición Y',-1,1,0.01,'','tr'],
 ['rx','Rotación X',-90,90,1,'°','tr'],['rz','Rotación Z',-90,90,1,'°','tr'],['scale','Escala',0.5,1.5,0.01,'×','tr']];
const TG=[['shell','Carcasa',1],['inner','Mecanismo interno',0],['wire','Malla (wireframe)',0],['turn','Plataforma giratoria',0],['float','Flotación suave',0],['glow','Brillo al pasar el cursor',1],['expl','Vista explosionada',0]];
const P={...DEF},T={};
SL.forEach(([k,l,mn,mx,st,u,box])=>{const r=document.createElement('div');r.className='row';
 r.innerHTML=`<span>${l}</span><output id="o_${k}"></output><input type="range" id="s_${k}" min="${mn}" max="${mx}" step="${st}" value="${P[k]}">`;
 $(box).appendChild(r);const s=r.querySelector('input'),o=r.querySelector('output');
 const f=()=>{P[k]=+s.value;o.textContent=(+s.value).toFixed(st<1?(st<0.1?2:1):0)+u};s.oninput=f;f();s._f=f});
TG.forEach(([k,l,v])=>{T[k]=!!v;const e=document.createElement('label');e.className='t';
 e.innerHTML=`<input type="checkbox" id="t_${k}" ${v?'checked':''}>${l}`;$('tg').appendChild(e);
 e.querySelector('input').onchange=ev=>{T[k]=ev.target.checked}});

// ---------- escena ----------
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.localClippingEnabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0x0b0d10);S.fog=new THREE.Fog(0x0b0d10,8,18);
const cam=new THREE.PerspectiveCamera(40,1,0.1,50);
S.add(new THREE.HemisphereLight(0xbfd4ff,0x1a1d24,0.9));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(3,5,4);S.add(dl);
const rim=new THREE.PointLight(0x3ddc97,1.2,12);rim.position.set(-3,1,-3);S.add(rim);
const grid=new THREE.GridHelper(12,24,0x2a313b,0x1a1f26);grid.position.y=-2.2;S.add(grid);
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),9);
const shellMats=[],allMats=[];
function mk(color,opts={}){const m=new THREE.MeshStandardMaterial({color,roughness:.45,metalness:.15,clippingPlanes:[clip],...opts});allMats.push(m);return m}
const accent=mk(0x3ddc97,{emissive:0x0d4a30,metalness:.5,roughness:.3});
const dark=mk(0x2b3038,{metalness:.7,roughness:.35});
const wireM=new THREE.MeshBasicMaterial({color:0x3ddc97,wireframe:true,transparent:true,opacity:.35,clippingPlanes:[clip]});
const root=new THREE.Group();S.add(root);
const parts=[],shells=[],inner=[],wires=[];
function shellMat(){const m=mk(0xe9edf2,{transparent:true});m.userData.base=new THREE.Color(0xe9edf2);shellMats.push(m);return m}
function addShell(mesh,m,name){mesh.userData.name=name;mesh.userData.mat=m;shells.push(mesh);
 const w=new THREE.Mesh(mesh.geometry,wireM);w.scale.copy(mesh.scale);mesh.add(w);wires.push(w);return mesh}

// palma
const palmG=new THREE.Group();root.add(palmG);
const pm=shellMat();
const palm=addShell(new THREE.Mesh(new THREE.BoxGeometry(1.15,1.0,0.45,4,4,2),pm),pm,'Palma');palmG.add(palm);
const wrist=addShell(new THREE.Mesh(new THREE.CylinderGeometry(.34,.4,.9,24),pm),pm,'Muñeca');wrist.position.y=-.9;palmG.add(wrist);
const innerG=new THREE.Group();root.add(innerG);
[[-.25,.05],[.25,.05]].forEach(([x,y])=>{const s=new THREE.Mesh(new THREE.BoxGeometry(.3,.4,.2),dark);s.position.set(x,y,-.02);innerG.add(s);inner.push(s)});
const batt=new THREE.Mesh(new THREE.BoxGeometry(.5,.3,.15),accent);batt.position.set(0,-.35,.04);innerG.add(batt);
const mot=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.7,16),accent);mot.position.set(0,-.95,0);innerG.add(mot);
// centro de masa
const com=new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),new THREE.MeshBasicMaterial({color:0xff5c7a}));root.add(com);

// dedos
const fingers=[];
function finger(name,x,y,sc,lens,rot){
 const g=new THREE.Group();g.position.set(x,y,0);if(rot)g.rotation.set(...rot);root.add(g);
 const m=shellMat(),f={name,g,segs:[],mat:m,baseX:x,base:g.position.clone()};
 let parent=g,py=0;
 lens.forEach((L,i)=>{const l=L*sc,r=(.12-i*.012)*(sc>.9?1:.9);
  const pv=new THREE.Group();pv.position.y=py;parent.add(pv);
  const mesh=addShell(new THREE.Mesh(new THREE.CylinderGeometry(r*.9,r,l,18,2),m),m,name);mesh.position.y=l/2;pv.add(mesh);
  const jt=addShell(new THREE.Mesh(new THREE.SphereGeometry(r*1.02,16,12),m),m,name);pv.add(jt);
  const tendon=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,l,8),accent);tendon.position.set(0,l/2,-r*.45);pv.add(tendon);inner.push(tendon);
  f.segs.push({pv,mesh,jt,tendon,l,r,baseY:py});parent=pv;py=l});
 fingers.push(f);return f}
finger('Meñique',-.46,.5,.78,[.5,.32,.26]);
finger('Anular',-.16,.5,.95,[.55,.36,.28]);
finger('Corazón',.15,.5,1.05,[.6,.4,.3]);
finger('Índice',.45,.5,.95,[.55,.36,.28]);
finger('Pulgar',.62,-.25,1,[.45,.36,.3],[0,-.6,-.9]);
const ANG=[1.0,1.2,.9];

// ---------- estado ----------
let cur=0,target=0,turn=0,t=0,reveal=-1,hover=null,exp=0;
$('bGrip').onclick=e=>{target=target?0:1;e.target.classList.toggle('on',!!target)};
$('bPrint').onclick=()=>{reveal=0};
$('bReset').onclick=()=>{Object.assign(P,DEF);SL.forEach(([k])=>{const s=$('s_'+k);s.value=DEF[k];s._f()});target=0;$('bGrip').classList.remove('on')};

// ---------- cámara orbital ----------
let az=.6,el=.15,dist=7.5,drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab'});
cv.addEventListener('pointermove',e=>{
 if(drag){az-=(e.clientX-drag.x)*.008;el=Math.max(-1.2,Math.min(1.3,el+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY}
 else{const b=cv.getBoundingClientRect();mouse.set(((e.clientX-b.left)/b.width)*2-1,-((e.clientY-b.top)/b.height)*2+1);moved=true}});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3.5,Math.min(13,dist+e.deltaY*.005))},{passive:false});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let moved=false;

function resize(){const b=cv.parentNode.getBoundingClientRect();R.setSize(b.width,b.height,false);cam.aspect=b.width/b.height;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// ---------- bucle ----------
const clock=new THREE.Clock();
function loop(){
 const dt=Math.min(clock.getDelta(),.05);t+=dt;
 // parámetros
 const tk=.75+P.wall*.13;
 shells.forEach(m=>{if(m.geometry.type!=='SphereGeometry'||true){m.scale.set(tk,1,tk)}});
 wires.forEach(w=>w.scale.set(1,1,1));
 cur+=(target-cur)*Math.min(1,dt*(1.2+P.force/18));
 fingers.forEach(f=>f.segs.forEach((s,i)=>{s.pv.rotation.x=ANG[i]*cur*P.flex}));
 // explosión
 exp+=((T.expl?1:0)-exp)*Math.min(1,dt*5);
 fingers.forEach(f=>{f.g.position.set(f.base.x*(1+exp*.5),f.base.y+exp*.45*(f.name==='Pulgar'?-1:1),f.base.z+exp*.15);
  f.segs.forEach((s,i)=>s.pv.position.y=s.baseY*(1+exp*.7))});
 palmG.position.z=exp*.5;innerG.position.z=-exp*.5;innerG.position.y=-exp*.2;
 // capas
 const sh=T.shell;shells.forEach(m=>m.visible=sh);
 wires.forEach(w=>w.visible=T.wire&&sh);
 innerG.visible=T.inner;fingers.forEach(f=>f.segs.forEach(s=>s.tendon.visible=T.inner));
 shellMats.forEach(m=>{m.opacity=T.inner?.28:1;m.depthWrite=!T.inner});
 // masa y fuerza
 const w=70+P.wall*34+P.force*.4;
 $('hW').textContent=w.toFixed(0)+' g';$('hF').textContent=(P.force*cur*.9+(cur>.9?0:0)).toFixed(0)+' / '+P.force+' N';
 $('hC').textContent=(cur*P.flex*57.3*1.0).toFixed(0)+'°';
 com.position.set(0,-1.2+P.dist/100*2.6,.3);com.position.z+=exp*.5;
 // transformación
 if(T.turn)turn+=dt*.6;
 root.scale.setScalar(P.scale);
 root.position.set(P.px,P.py+(T.float?Math.sin(t*1.6)*.08:0),0);
 root.rotation.set(P.rx*Math.PI/180,turn,P.rz*Math.PI/180);
 // revelado de impresión
 if(reveal>=0){reveal+=dt;const k=Math.min(reveal/2.8,1);clip.constant=-2.2+k*4.6+(P.py);if(k>=1){reveal=-1;clip.constant=9}}
 // hover
 shellMats.forEach(m=>m.emissive.setHex(0x000000));
 let name='—';
 if(T.glow&&moved&&!drag){ray.setFromCamera(mouse,cam);const h=ray.intersectObjects(shells,false)[0];
  hover=h?h.object:null}
 if(hover&&T.glow&&!drag){hover.userData.mat.emissive.setHex(0x0f6b46);name=hover.userData.name}
 $('hPart').textContent=name;
 // cámara
 cam.position.set(Math.sin(az)*Math.cos(el)*dist,.3+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);
 cam.lookAt(0,.2,0);
 R.render(S,cam);requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
