<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prisma: partículas que se vuelven personajes</title>
<style>
:root{color-scheme:dark;--bg:#04060d;--fg:#e8f4ff;--dim:rgba(232,244,255,.55);--acc:#6fe3ff;--line:rgba(140,210,255,.22)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background-image:radial-gradient(rgba(120,200,255,.13) 1px,transparent 1.4px);background-size:26px 26px;-webkit-mask:none}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,var(--bg) 85%);pointer-events:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
header{position:fixed;z-index:2;left:0;right:0;top:0;padding:calc(20px + env(safe-area-inset-top,0px)) 24px 0;pointer-events:none}
h1{margin:0;font-size:clamp(26px,5vw,44px);font-weight:500;letter-spacing:-.02em}
#who{margin:4px 0 0;font-size:15px;color:var(--acc);transition:opacity .4s}
nav{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
button{font:inherit;font-size:14px;color:var(--fg);background:rgba(10,18,34,.6);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s,border-color .2s}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:rgba(111,227,255,.18);border-color:var(--acc)}
#hint{position:fixed;z-index:2;right:24px;top:calc(24px + env(safe-area-inset-top,0px));max-width:230px;text-align:right;font-size:13px;line-height:1.45;color:var(--dim);pointer-events:none}
@media(max-width:640px){#hint{display:none}}
</style>
</head>
<body>
<header><h1>Prisma</h1><p id="who"></p></header>
<p id="hint">Pasa el cursor por las partículas para arrastrarlas. Cambia de personaje con ← → o con 1, 2, 3.</p>
<canvas id="c"></canvas>
<nav id="nav"></nav>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=innerWidth<700?3200:6000;
let W,H,dpr,sc,cx,cy;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;sc=Math.min(W*.4,H*.33);cx=W/2;cy=H*.46}
resize();addEventListener('resize',resize);

// [tipo, cx,cy,cz, a,b,c (medios ejes), color, refuerzo]  e=elipsoide b=caja
const CH=[
{name:'Robot',yc:.19,s:.95,pal:[[90,225,255],[110,150,255],[255,90,200],[235,250,255]],parts:[
['b',0,.62,0,.25,.2,.21,0,1],['e',-.12,.66,.22,.07,.07,.03,2,3],['e',.12,.66,.22,.07,.07,.03,2,3],
['e',0,1,0,.03,.12,.03,1,2],['e',0,1.12,0,.06,.06,.06,2,3],
['b',0,.05,0,.28,.3,.18,0,1],['b',0,.1,.19,.12,.1,.02,1,2],
['b',-.42,.05,0,.07,.28,.07,0,1],['b',.42,.05,0,.07,.28,.07,0,1],
['e',-.42,-.3,0,.09,.09,.09,1,2],['e',.42,-.3,0,.09,.09,.09,1,2],
['b',-.14,-.5,0,.09,.25,.09,0,1],['b',.14,-.5,0,.09,.25,.09,0,1],
['b',-.14,-.78,.05,.12,.05,.16,1,1],['b',.14,-.78,.05,.12,.05,.16,1,1]]},
{name:'Conejo',yc:.32,s:.88,pal:[[200,170,255],[255,150,210],[255,215,120],[255,245,250]],parts:[
['e',0,-.25,0,.45,.5,.4,0,1],['e',0,.45,.05,.34,.3,.3,0,1],
['e',-.14,1.05,0,.09,.4,.07,0,1],['e',.14,1.05,0,.09,.4,.07,0,1],
['e',-.14,1.05,.04,.05,.3,.03,1,2],['e',.14,1.05,.04,.05,.3,.03,1,2],
['e',-.12,.5,.31,.04,.05,.03,3,4],['e',.12,.5,.31,.04,.05,.03,3,4],['e',0,.4,.34,.05,.04,.03,1,4],
['e',0,-.4,-.42,.14,.14,.14,3,2],
['e',-.2,-.75,.15,.15,.07,.22,0,1],['e',.2,-.75,.15,.15,.07,.22,0,1],
['e',-.38,-.1,.1,.1,.25,.1,0,1],['e',.38,-.1,.1,.1,.25,.1,0,1],
['e',0,-.15,.38,.2,.28,.05,3,1]]},
{name:'Alien',yc:.16,s:.82,pal:[[110,255,170],[80,225,255],[255,90,200],[235,250,255]],parts:[
['e',0,.5,0,.55,.5,.45,0,1],['e',-.22,.5,.36,.16,.1,.07,2,4],['e',.22,.5,.36,.16,.1,.07,2,4],
['e',0,.22,.38,.06,.03,.03,3,3],['e',0,-.3,0,.25,.4,.2,0,1],
['e',-.38,-.25,0,.05,.3,.05,0,1],['e',.38,-.25,0,.05,.3,.05,0,1],
['e',-.2,1.05,0,.025,.2,.025,1,2],['e',.2,1.05,0,.025,.2,.025,1,2],
['e',-.2,1.3,0,.07,.07,.07,2,3],['e',.2,1.3,0,.07,.07,.07,2,3],
['e',-.1,-.8,0,.07,.25,.07,0,1],['e',.1,-.8,0,.07,.25,.07,0,1]]}
];

function sample(ch,n){
  const P=ch.parts,w=P.map(p=>(p[4]*p[5]+p[5]*p[6]+p[4]*p[6])*(p[0]=='b'?8:4.2)*p[8]);
  const tot=w.reduce((a,b)=>a+b,0),o=new Float32Array(n*4);
  for(let i=0;i<n;i++){
    let r=Math.random()*tot,k=0;while(r>w[k]&&k<P.length-1){r-=w[k];k++}
    const p=P[k],a=p[4],b=p[5],c=p[6];let x,y,z;
    if(p[0]=='e'){const u=Math.random()*2-1,t=Math.random()*6.2832,q=Math.sqrt(1-u*u);x=q*Math.cos(t)*a;y=u*b;z=q*Math.sin(t)*c}
    else{const fa=b*c,fb=a*c,fc=a*b,r2=Math.random()*(fa+fb+fc),s=Math.random()<.5?-1:1,u=Math.random()*2-1,v=Math.random()*2-1;
      if(r2<fa){x=s*a;y=u*b;z=v*c}else if(r2<fa+fb){y=s*b;x=u*a;z=v*c}else{z=s*c;x=u*a;y=v*b}}
    o[i*4]=(x+p[1])*ch.s;o[i*4+1]=(y+p[2]-ch.yc)*ch.s;o[i*4+2]=(z+p[3])*ch.s;o[i*4+3]=p[7];
  }
  return o;
}
const TG=CH.map(c=>sample(c,N));

const F=()=>new Float32Array(N);
const px=F(),py=F(),pz=F(),vx=F(),vy=F(),vz=F(),tx=F(),ty=F(),tz=F(),rel=F(),ox=F(),oy=F(),ovx=F(),ovy=F(),gl=F(),cr=F(),cg=F(),cb=F(),tr=F(),tg=F(),tb=F(),ph=F();
const pend=new Uint8Array(N);
let cur=0,now=0;
for(let i=0;i<N;i++){ // nacen en la base del proyector y brotan hacia arriba
  const a=Math.random()*6.283,r=Math.random()*.6;
  px[i]=Math.cos(a)*r;pz[i]=Math.sin(a)*r;py[i]=-1;
  vx[i]=(Math.random()-.5)*2;vz[i]=(Math.random()-.5)*2;vy[i]=2+Math.random()*4;
  rel[i]=Math.random()*1.1;pend[i]=1;ph[i]=Math.random()*6.283;
  cr[i]=tr[i]=111;cg[i]=tg[i]=227;cb[i]=tb[i]=255;
}

function go(k){
  cur=(k+CH.length)%CH.length;
  for(let i=0;i<N;i++){rel[i]=now+Math.random()*.55;pend[i]=1}
  document.getElementById('who').textContent=CH[cur].name;
  [...document.querySelectorAll('#nav button')].forEach((b,j)=>{b.classList.toggle('on',j==cur);b.setAttribute('aria-pressed',j==cur)});
  clearInterval(timer);if(auto&&!reduce)timer=setInterval(()=>go(cur+1),7500);
}
let auto=true,timer;
const nav=document.getElementById('nav');
CH.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.name;b.onclick=()=>go(i);nav.appendChild(b)});
const ab=document.createElement('button');ab.textContent='Cambio automático';ab.className=reduce?'':'on';
ab.onclick=()=>{auto=!auto;ab.classList.toggle('on',auto);go(cur)};nav.appendChild(ab);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(cur+1);else if(e.key=='ArrowLeft')go(cur-1);else if(e.key>='1'&&e.key<='3')go(+e.key-1)});
go(0);

let mx=-999,my=-999,mvx=0,mvy=0,lx=0,ly=0;
addEventListener('pointermove',e=>{mvx=(e.clientX-lx)*.6+mvx*.4;mvy=(e.clientY-ly)*.6+mvy*.4;lx=mx=e.clientX;ly=my=e.clientY});
addEventListener('pointerleave',()=>{mx=my=-999});
addEventListener('pointerup',e=>{if(e.pointerType!='mouse')mx=my=-999});

function projector(t){
  const by=cy+sc*1.08,top=cy-sc*1.4;
  const g=ctx.createLinearGradient(0,by,0,top);g.addColorStop(0,'rgba(111,227,255,.16)');g.addColorStop(1,'rgba(111,227,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx-.45*sc,by);ctx.lineTo(cx+.45*sc,by);ctx.lineTo(cx+.95*sc,top);ctx.lineTo(cx-.95*sc,top);ctx.fill();
  const rg=ctx.createRadialGradient(cx,by,0,cx,by,sc);rg.addColorStop(0,'rgba(111,227,255,.35)');rg.addColorStop(1,'rgba(111,227,255,0)');
  ctx.save();ctx.translate(cx,by);ctx.scale(1,.2);ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,sc,0,6.283);ctx.fill();ctx.restore();
  ctx.lineWidth=1.2;
  [.9,.65,.4].forEach((r,i)=>{
    ctx.strokeStyle='rgba(111,227,255,'+(.55-i*.12+Math.sin(t*2-i)*.1)+')';
    ctx.setLineDash(i==1?[3,9]:[]);ctx.lineDashOffset=-t*20*(i+1);
    ctx.beginPath();ctx.ellipse(cx,by,r*sc,r*sc*.2,0,0,6.283);ctx.stroke();
  });
  ctx.setLineDash([]);
}

let last=performance.now();
function frame(t){
  let dt=Math.min((t-last)/1000,.033);last=t;now+=dt;
  mvx*=.9;mvy*=.9;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  projector(now);
  const yaw=now*(reduce?.08:.35),ca=Math.cos(yaw),sa=Math.sin(yaw);
  const T=TG[cur],damp=Math.exp(-dt*5),od=Math.exp(-dt*4),R=Math.min(130,W*.25),R2=R*R,ck=Math.min(1,dt*4);
  for(let i=0;i<N;i++){
    if(pend[i]&&now>=rel[i]){
      const j=i*4;tx[i]=T[j];ty[i]=T[j+1];tz[i]=T[j+2];
      const c=CH[cur].pal[T[j+3]|0];tr[i]=c[0];tg[i]=c[1];tb[i]=c[2];pend[i]=0;
    }
    if(!pend[i]||now>rel[i]){
      const wob=Math.sin(now*1.3+ph[i])*.012;
      const dx=tx[i]+wob-px[i],dy=ty[i]+Math.cos(now*1.1+ph[i])*.012-py[i],dz=tz[i]+wob-pz[i];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      vx[i]+=dx*22*dt;vy[i]+=dy*22*dt;vz[i]+=dz*22*dt;
      if(d>.15){const s=Math.min(d,1.5)*2.2*dt;vx[i]+=-pz[i]*s;vz[i]+=px[i]*s}
      const gt=Math.min(1,d*.8);if(gt>gl[i])gl[i]=gt;
    }
    vx[i]*=damp;vy[i]*=damp;vz[i]*=damp;
    px[i]+=vx[i]*dt;py[i]+=vy[i]*dt;pz[i]+=vz[i]*dt;
    const xr=px[i]*ca+pz[i]*sa,zr=-px[i]*sa+pz[i]*ca,f=4.5/(4.5-zr);
    let sx=cx+xr*sc*f+ox[i],sy=cy-py[i]*sc*f+oy[i];
    const ddx=sx-mx,ddy=sy-my,d2=ddx*ddx+ddy*ddy;
    if(d2<R2){const d=Math.sqrt(d2)+.01,k=1-d/R;ovx[i]+=(ddx/d)*k*1500*dt+mvx*k*dt*40;ovy[i]+=(ddy/d)*k*1500*dt+mvy*k*dt*40;if(k>gl[i])gl[i]=k}
    ovx[i]+=-ox[i]*16*dt;ovy[i]+=-oy[i]*16*dt;ovx[i]*=od;ovy[i]*=od;ox[i]+=ovx[i]*dt;oy[i]+=ovy[i]*dt;
    const g=gl[i];gl[i]=g>0?g-dt*.9:0;
    cr[i]+=(tr[i]-cr[i])*ck;cg[i]+=(tg[i]-cg[i])*ck;cb[i]+=(tb[i]-cb[i])*ck;
    const dep=Math.max(0,Math.min(1,(zr+1.1)/2.2)),m=g*.7;
    const a=Math.min(1,.28+.6*dep+g*.5),s=(1.1+1.3*dep+g*1.8)*f;
    ctx.fillStyle='rgba('+((cr[i]+(255-cr[i])*m)|0)+','+((cg[i]+(255-cg[i])*m)|0)+','+((cb[i]+(255-cb[i])*m)|0)+','+a.toFixed(2)+')';
    ctx.fillRect(sx-s/2,sy-s/2,s,s);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
